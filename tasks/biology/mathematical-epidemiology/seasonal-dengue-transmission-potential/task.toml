version = "1.0.0"
authors = []
keywords = ["dengue", "aedes-aegypti", "thermal-performance-curves", "periodic-R0", "floquet", "next-generation-operator", "vector-borne-disease"]

[metadata]
author_name = "Suvankar Majee"
author_email = "suvankarmajee2@gmail.com"
difficulty = "hard"
category = "biology"
tags = ["mathematical-epidemiology", "vector-borne-disease", "thermal-biology", "dynamical-systems", "parameter-estimation"]
domain = "Biology"
subdomains = ["Mathematical Epidemiology", "Vector Ecology", "Dynamical Systems"]
workflow_types = ["Computational modelling workflow", "Data science / ML workflow"]
task_types = ["Thermal-response parameter estimation", "Model calibration against field survey", "Threshold (basic reproduction number) analysis in a periodic environment"]
skills = ["Multi-source laboratory data harmonisation", "Nonlinear least squares", "Climate-record homogenisation", "Periodic ODE systems and Floquet theory", "Next-generation operators", "Stiff numerical integration"]
tool_types = ["Python (NumPy, SciPy, pandas)", "command-line tools"]
estimated_step_count = 32
expected_expert_time = "3-5 hours"
outcome_type = "Deterministic numerical outputs (CSV and JSON) checked against independent recomputation within tolerance"
difficulty_explanation = """
The answer is based on a sequence of sequential decisions, where each of the decisions changes the final estimate of the reproduction number by more than the verification uncertainty if it is made incorrectly. There are also differences in temperature units, setpoint versus realised temperature offset, percentage, mortality rates versus lifespan, and extrinsic incubation periods versus mortality rates, as well as QA flagged replicates, across three laboratories. Homogenisation is required for a site move and removal of a stuck-sensor episode (recorded indirectly). This density-dependence coefficient is not provided and it has to be determined from a survey based on the periodic (not quasi-equilibrium) vector population, corrected for the collection efficiency. The final one is the seasonal R0, which is the spectral radius for a next generation operator on periodic functions (Bacaer-Guernaoui / Wang-Zhao), and as you can see the common shortcuts (R0 at mean temperature, time averaged instantaneous R0, and quasi-static mosquito density) differ by only a little in the qualitative conclusion they draw about the establishment risk, but by a lot in the numbers. The calibrated mosquito density is implicitly biased about 10 percent high by coarse explicit integration because the immature-stage equation is stiff in summer.
"""
references = [
  "Mordecai, E. A., Cohen, J. M., Evans, M. V., Gudapati, P., Johnson, L. R., Lippi, C. A., Miazgowicz, K., Murdock, C. C., Rohr, J. R., Ryan, S. J., Savage, V., Shocket, M. S., Stewart Ibarra, A., Thomas, M. B., & Weikel, D. P. (2017). Detecting the impact of temperature on transmission of Zika, dengue, and chikungunya using mechanistic models. PLoS Neglected Tropical Diseases, 11(4), e0005568. [Source of the Briere/quadratic trait forms and the approximate Ae. aegypti parameter values used to generate the synthetic laboratory data]",
  "Briere, J.-F., Pracros, P., Le Roux, A.-Y., & Pierre, J.-S. (1999). A novel rate model of temperature-dependent development for arthropods. Environmental Entomology, 28(1), 22-29. [Definition of the Briere thermal performance curve]",
  "Diekmann, O., Heesterbeek, J. A. P., & Roberts, M. G. (2010). The construction of next-generation matrices for compartmental epidemic models. Journal of the Royal Society Interface, 7(47), 873-885. [Next-generation convention for the constant-temperature R0]",
  "Bacaer, N., & Guernaoui, S. (2006). The epidemic threshold of vector-borne diseases with seasonality: The case of cutaneous leishmaniasis in Chichaoua, Morocco. Journal of Mathematical Biology, 53(3), 421-436. [Definition of R0 for vector-borne diseases in a periodic environment]",
  "Wang, W., & Zhao, X.-Q. (2008). Threshold dynamics for compartmental epidemic models in periodic environments. Journal of Dynamics and Differential Equations, 20(3), 699-717. [Floquet characterisation of the periodic R0 used in the oracle and verifier]",
  "Zhao, X.-Q. (2017). Dynamical systems in population biology (2nd ed.). Springer. [Existence, uniqueness and global attractivity of the positive periodic solution of the cooperative, sublinear vector model]",
  "Chan, M., & Johansson, M. A. (2012). The incubation periods of dengue viruses. PLoS ONE, 7(11), e50972. [Intrinsic incubation period of 5.9 days used in the human model]",
]
